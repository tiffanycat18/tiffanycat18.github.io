<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>If I loved you without fear</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="https://use.typekit.net/rxq6knq.css">
</head>

<body>

<h1>If I loved you without fear</h1>

<p id="subtitle">a palette of the love i would give if i felt safe enough.</p>

<p><br><br><br><br><br><br></p>

<div id="lineOutput" class="line-output">
  If I loved you without fear…
</div>

<p><br><br></p>

<div class="palette-wrapper">
  <div class="palette-frame">
    <img
      id="paletteImage"
      class="palette-image"
      src="images/eyeshadow cutout.png"
      alt="Eyeshadow palette"
    />
    <div id="squaresContainer" class="squares-container"></div>
  </div>
</div>

<p><br></p>

<div class="hover-text">
  hover over each shade to reveal a way love could feel
</div>

<p><br><br><br><br><br><br><br><br><br></p>
<!-- Background song -->
<audio id="bgAudio" src="audio/keshi - Just To Die.mp3" loop></audio>

<!-- Minimal toggle button -->
<button id="audioToggle" class="audio-toggle">
  ⏸ stop song
</button>

<video id="bg-video" autoplay muted loop playsinline>
  <source src="videos/romeo and juliet.mp4" type="video/mp4" />
</video>
<div id="root"></div>

<!-- JS file -->
<script src="script.js"></script>
</body>
</html>
